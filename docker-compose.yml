services:
  backend:
    build:
      context: ./backend
      target: development
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]

  frontend:
    build:
      context: ./frontend
      target: development
    depends_on: [backend]
    env_file: .env
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
