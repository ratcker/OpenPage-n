project:
  id: 0812951a-c377-4045-8c09-83595bd5222d
  hostname: sandbox.xn--e1aamodgc0e.xn--p1ai
  sourceSHA: "0123456789abcdef0123456789abcdef01234567"
  configRevision: "revision-1"

services:
  frontend:
    image: ghcr.io/example/frontend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    replicas: 2
    port: 80
    resources:
      requests: {cpu: "100m", memory: "64Mi"}
      limits: {cpu: "250m", memory: "128Mi"}
    env:
      API_PATH: /api
  backend:
    image: ghcr.io/example/backend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    replicas: 1
    port: 8000
    resources:
      requests: {cpu: "200m", memory: "128Mi"}
      limits: {cpu: "500m", memory: "256Mi"}
    env:
      DB_HOST: postgresql
      DB_NAME: app
      DB_USER: app
    secretEnv:
      DB_PASSWORD: {name: db-credentials, key: password}

routes:
  - {path: /, service: frontend}
  - {path: /api, service: backend}

gateway:
  name: public
  namespace: envoy-gateway-system

postgresql:
  image: docker.io/library/postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
  database: app
  user: app
  passwordSecretKeyRef: {name: db-credentials, key: password}
  storageSize: 2Gi
  storageClass: longhorn
  resources:
    requests: {cpu: "100m", memory: "128Mi"}
    limits: {cpu: "500m", memory: "512Mi"}

sealedSecrets:
  db-credentials:
    encryptedData:
      password: 
