{{- define "openpage-app.postgresqlSelector" -}}
app.kubernetes.io/component: postgresql
openpage/project-id: {{ .Values.project.id | lower | quote }}
{{- end -}}
{{- with .Values.postgresql }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: {{ $.Release.Namespace | quote }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .storageClass | quote }}
  resources:
    requests:
      storage: {{ .storageSize | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: {{ $.Release.Namespace | quote }}
spec:
  clusterIP: None
  selector:
    {{- include "openpage-app.postgresqlSelector" $ | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: {{ $.Release.Namespace | quote }}
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "openpage-app.postgresqlSelector" $ | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openpage-app.postgresqlSelector" $ | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ .image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: postgres
          resources:
            {{- toYaml .resources | nindent 12 }}
          env:
            - name: POSTGRES_DB
              value: {{ .database | quote }}
            - name: POSTGRES_USER
              value: {{ .user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "openpage-app.secretKeyRef" (dict "secrets" $.Values.sealedSecrets "ref" .passwordSecretKeyRef) | nindent 18 }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgresql-data
{{- end }}
