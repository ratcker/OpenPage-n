{{- range $name, $secret := .Values.sealedSecrets }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
spec:
  encryptedData:
    {{- toYaml $secret.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ $name | quote }}
      namespace: {{ $.Release.Namespace | quote }}
    type: Opaque
{{- end }}
