{{- if .Values.routes }}
{{- $paths := dict }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "openpage-%s" (.Values.project.id | lower) | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | quote }}
      namespace: {{ .Values.gateway.namespace | quote }}
  hostnames:
    - {{ .Values.project.hostname | quote }}
  rules:
    {{- range .Values.routes }}
    {{- $service := get $.Values.services .service }}
    {{- if not $service }}
      {{- fail (printf "route %q references unknown service %q" .path .service) }}
    {{- end }}
    {{- if not $service.port }}
      {{- fail (printf "route %q requires a port on service %q" .path .service) }}
    {{- end }}
    {{- $path := trimSuffix "/" .path }}
    {{- if hasKey $paths $path }}
      {{- fail (printf "duplicate route path prefix %q" .path) }}
    {{- end }}
    {{- $_ := set $paths $path true }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path | quote }}
      backendRefs:
        - name: {{ include "openpage-app.serviceName" (dict "projectID" $.Values.project.id "service" .service) | quote }}
          port: {{ $service.port }}
    {{- end }}
{{- end }}
